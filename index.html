<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vero Italiano - Platform Architecture</title>
<style>
  :root{
    --bg:#faf7f2;
    --card-bg:#ffffff;
    --ink:#1f2a24;
    --muted:#6b7570;
    --line:#e4ded3;
    --green:#2f5d3a;
    --green-light:#e7f0e5;
    --blue:#2c6b8a;
    --blue-light:#e7f0f5;
    --gold:#b8862b;
    --gold-light:#f8efdb;
    --red-it:#b7312c;
    --red-light:#fbe7e6;
    --panel-bg:#f1efe9;
    --engine-grad-1:#faf6ee;
    --engine-grad-2:#f5f0e4;
    --shadow:0 4px 18px rgba(31,42,36,0.08);
  }
  html[data-theme="dark"]{
    --bg:#14201a;
    --card-bg:#1c2b23;
    --ink:#eef2ee;
    --muted:#9fb0a5;
    --line:#2e4136;
    --green:#4f9464;
    --green-light:#22362a;
    --blue:#4a92b8;
    --blue-light:#1d323d;
    --gold:#d9a94b;
    --gold-light:#3a2f18;
    --red-it:#e2665f;
    --red-light:#3a2220;
    --panel-bg:#233229;
    --engine-grad-1:#2b3a2c;
    --engine-grad-2:#25321f;
    --shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:40px 24px 80px;
    transition:background .15s ease, color .15s ease;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;position:relative;}
  .controls{
    position:absolute;top:0;right:0;display:flex;gap:8px;align-items:center;
  }
  .lang-switch{
    display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--line);
    border-radius:20px;padding:3px;box-shadow:var(--shadow);
  }
  .lang-switch button{
    border:none;background:transparent;padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--muted);letter-spacing:.03em;
  }
  .lang-switch button.active{background:var(--green);color:#fff;}
  .theme-toggle{
    border:1px solid var(--line);background:var(--card-bg);border-radius:20px;padding:7px 12px;
    font-size:13px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);
  }
  .flagbar{height:4px;width:80px;margin:0 auto 20px;background:linear-gradient(90deg,var(--green) 0 33%, #fff 33% 66%, var(--red-it) 66% 100%);border-radius:2px;}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-0.01em;}
  .subtitle{color:var(--muted);font-size:14.5px;max-width:760px;margin:0 auto;line-height:1.5;}

  .layer{margin-bottom:8px;}
  .layer-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0 0 8px 4px;font-weight:700;
  }
  .row{display:grid;gap:14px;margin-bottom:6px;}
  .row.cols1{grid-template-columns:1fr;}
  .row.cols2{grid-template-columns:1fr 1fr;}
  .row.cols3{grid-template-columns:1fr 1fr 1fr;}

  .box{
    background:var(--card-bg);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:14px 16px;font-size:12.5px;line-height:1.5;
  }
  .box h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:7px;}
  .box p{margin:0;color:var(--muted);}
  .box ul{margin:6px 0 0;padding-left:16px;color:var(--muted);}
  .box ul li{margin-bottom:2px;}

  .box.actor{background:var(--panel-bg);border-style:dashed;}
  .box.ingestion{border-left:4px solid var(--green);}
  .box.extract{border-left:4px solid #6b8e6f;}
  .box.evidence{border-left:4px solid var(--blue);}
  .box.engine{border-left:4px solid var(--gold);background:linear-gradient(135deg,var(--engine-grad-1),var(--engine-grad-2));}
  .box.consumer{border-left:4px solid var(--red-it);}

  .icon{
    width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;flex-shrink:0;
  }
  .icon.green{background:var(--green);}
  .icon.blue{background:var(--blue);}
  .icon.gold{background:var(--gold);}
  .icon.red{background:var(--red-it);}
  .icon.gray{background:#8a8f89;}

  .arrow-row{display:flex;justify-content:center;color:var(--muted);font-size:20px;margin:2px 0;}

  .side-note{
    margin-top:28px;background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 22px;
  }
  .side-note h3{margin:0 0 10px;font-size:14.5px;}
  .side-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .side-item{font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--panel-bg);border-radius:10px;padding:10px 12px;}
  .side-item strong{display:block;color:var(--ink);font-size:12.5px;margin-bottom:3px;}

  footer{text-align:center;margin-top:36px;color:var(--muted);font-size:11.5px;line-height:1.6;}

  @media (max-width:900px){
    .row.cols2, .row.cols3{grid-template-columns:1fr;}
    .controls{position:static;justify-content:center;margin-bottom:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="controls">
      <div class="lang-switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <button id="btn-it" onclick="setLang('it')">IT</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
    </div>
    <div class="flagbar"></div>
    <h1 data-i18n="h1"></h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <div class="layer">
    <div class="layer-label" data-i18n="l0.label"></div>
    <div class="row cols3">
      <div class="box actor"><h4><span class="icon gray">1</span><span data-i18n="l0.b1.h"></span></h4><p data-i18n="l0.b1.p"></p></div>
      <div class="box actor"><h4><span class="icon gray">2</span><span data-i18n="l0.b2.h"></span></h4><p data-i18n="l0.b2.p"></p></div>
      <div class="box actor"><h4><span class="icon gray">3</span><span data-i18n="l0.b3.h"></span></h4><p data-i18n="l0.b3.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;&#8595;&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l1.label"></div>
    <div class="row cols2">
      <div class="box ingestion"><h4><span class="icon green">&#128196;</span><span data-i18n="l1.b1.h"></span></h4><ul><li data-i18n="l1.b1.i1"></li><li data-i18n="l1.b1.i2"></li><li data-i18n="l1.b1.i3"></li></ul></div>
      <div class="box ingestion"><h4><span class="icon green">&#128279;</span><span data-i18n="l1.b2.h"></span></h4><ul><li data-i18n="l1.b2.i1"></li><li data-i18n="l1.b2.i2"></li></ul></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l2.label"></div>
    <div class="row cols1">
      <div class="box extract"><h4><span class="icon green">&#9881;</span><span data-i18n="l2.b1.h"></span></h4><p data-i18n="l2.b1.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l3.label"></div>
    <div class="row cols3">
      <div class="box evidence"><h4><span class="icon blue">&#127974;</span><span data-i18n="l3.b1.h"></span></h4><p data-i18n="l3.b1.p"></p></div>
      <div class="box evidence"><h4><span class="icon blue">&#127991;</span><span data-i18n="l3.b2.h"></span></h4><p data-i18n="l3.b2.p"></p></div>
      <div class="box evidence"><h4><span class="icon blue">&#128752;</span><span data-i18n="l3.b3.h"></span></h4><p data-i18n="l3.b3.p"></p></div>
    </div>
    <div class="arrow-row" style="margin-top:10px;">&#8600;&#8595;&#8599;</div>
    <div class="row cols1">
      <div class="box engine"><h4><span class="icon gold">&#9878;</span><span data-i18n="l3.engine.h"></span></h4><p data-i18n="l3.engine.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l3b.label"></div>
    <div class="row cols2">
      <div class="box evidence"><h4><span class="icon blue">&#128221;</span><span data-i18n="l3b.b1.h"></span></h4><p data-i18n="l3b.b1.p"></p></div>
      <div class="box evidence"><h4><span class="icon blue">&#128230;</span><span data-i18n="l3b.b2.h"></span></h4><p data-i18n="l3b.b2.p"></p></div>
    </div>
    <div class="arrow-row" style="margin-top:10px;">&#8600;&#8595;&#8599;</div>
    <div class="row cols1">
      <div class="box engine"><h4><span class="icon gold">&#128274;</span><span data-i18n="l3b.engine.h"></span></h4><p data-i18n="l3b.engine.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l3c.label"></div>
    <div class="row cols2">
      <div class="box evidence"><h4><span class="icon blue">&#129514;</span><span data-i18n="l3c.b1.h"></span></h4><p data-i18n="l3c.b1.p"></p></div>
      <div class="box evidence"><h4><span class="icon blue">&#127919;</span><span data-i18n="l3c.b2.h"></span></h4><p data-i18n="l3c.b2.p"></p></div>
    </div>
    <div class="arrow-row" style="margin-top:10px;">&#8600;&#8595;&#8599;</div>
    <div class="row cols1">
      <div class="box engine"><h4><span class="icon gold">&#127942;</span><span data-i18n="l3c.engine.h"></span></h4><p data-i18n="l3c.engine.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l4.label"></div>
    <div class="row cols3">
      <div class="box consumer"><h4><span class="icon red">&#128202;</span><span data-i18n="l4.b1.h"></span></h4><p data-i18n="l4.b1.p"></p></div>
      <div class="box consumer"><h4><span class="icon red">&#128196;</span><span data-i18n="l4.b2.h"></span></h4><p data-i18n="l4.b2.p"></p></div>
      <div class="box consumer"><h4><span class="icon red">&#128268;</span><span data-i18n="l4.b3.h"></span></h4><p data-i18n="l4.b3.p"></p></div>
    </div>
  </div>

  <div class="arrow-row">&#8595;</div>

  <div class="layer">
    <div class="layer-label" data-i18n="l5.label"></div>
    <div class="row cols1">
      <div class="box actor"><h4><span class="icon gray">&#128100;</span><span data-i18n="l5.b1.h"></span></h4><p data-i18n="l5.b1.p"></p></div>
    </div>
  </div>

  <div class="side-note">
    <h3 data-i18n="fraud.title"></h3>
    <div class="side-grid">
      <div class="side-item"><strong data-i18n="fraud.i1.h"></strong><span data-i18n="fraud.i1.p"></span></div>
    </div>
  </div>

  <div class="side-note">
    <h3 data-i18n="side.title"></h3>
    <div class="side-grid">
      <div class="side-item"><strong data-i18n="side.i1.h"></strong><span data-i18n="side.i1.p"></span></div>
      <div class="side-item"><strong data-i18n="side.i2.h"></strong><span data-i18n="side.i2.p"></span></div>
      <div class="side-item"><strong data-i18n="side.i3.h"></strong><span data-i18n="side.i3.p"></span></div>
      <div class="side-item"><strong data-i18n="side.i4.h"></strong><span data-i18n="side.i4.p"></span></div>
    </div>
  </div>

  <div class="side-note">
    <h3 data-i18n="core.title"></h3>
    <div class="side-grid">
      <div class="side-item"><strong data-i18n="core.i1.h"></strong><span data-i18n="core.i1.p"></span></div>
      <div class="side-item"><strong data-i18n="core.i2.h"></strong><span data-i18n="core.i2.p"></span></div>
      <div class="side-item"><strong data-i18n="core.i3.h"></strong><span data-i18n="core.i3.p"></span></div>
      <div class="side-item"><strong data-i18n="core.i4.h"></strong><span data-i18n="core.i4.p"></span></div>
      <div class="side-item"><strong data-i18n="core.i5.h"></strong><span data-i18n="core.i5.p"></span></div>
    </div>
  </div>

  <div class="side-note">
    <h3 data-i18n="challenges.title"></h3>
    <div class="side-grid">
      <div class="side-item"><strong data-i18n="challenges.i1.h"></strong><span data-i18n="challenges.i1.p"></span></div>
      <div class="side-item"><strong data-i18n="challenges.i2.h"></strong><span data-i18n="challenges.i2.p"></span></div>
      <div class="side-item"><strong data-i18n="challenges.i3.h"></strong><span data-i18n="challenges.i3.p"></span></div>
    </div>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
var translations = {
  en: {
    h1: "Vero Italiano - Platform Architecture",
    subtitle: "Vero Italiano is a trust mark, not a marketplace. It never takes title to goods and does not intermediate the buyer-seller relationship; it verifies specific transactions and certifies specific products, which enhances the reputation of the exporters and traders who earn the mark rather than replacing them.",
    "l0.label": "Data contributors",
    "l0.b1.h": "Exporters / Producers",
    "l0.b1.p": "Upload invoices, lot records, shipping and customs documents. Free or low-cost onboarding to maximize participation.",
    "l0.b2.h": "Consortiums / Registries",
    "l0.b2.p": "DOP/IGP membership records, business and land registries, customs authorities. Italy's official registers (SIAN, ICQRF) have no public APIs, so Phase 1 relies on the EU's open e-Ambrosia register plus seeded consortium member lists rather than live registry API agreements.",
    "l0.b3.h": "Satellite / Agronomic Providers",
    "l0.b3.p": "Copernicus Sentinel-2 via the Copernicus Data Space Ecosystem, free and open-access, 10m resolution refreshed every 5 days. NDVI and reflectance are queried directly by coordinates with no raster download and 1-2 second latency, cached like existing geofence checks. Yield benchmarks come from ISMEA's regional tables by province and crop.",

    "l1.label": "1. Ingestion layer",
    "l1.b1.h": "Producer portal",
    "l1.b1.i1": "Guided document upload, minimal friction",
    "l1.b1.i2": "Lot / plot / farm identity capture",
    "l1.b1.i3": "Status tracking for the producer",
    "l1.b2.h": "ERP / EDI connector",
    "l1.b2.i1": "Optional API for larger producers",
    "l1.b2.i2": "Bulk invoice and shipping-record sync",

    "l2.label": "2. Extraction and normalization (VeriPura Core)",
    "l2.b1.h": "VeriPura Core: document validation",
    "l2.b1.p": "Verifies the legitimacy and completeness of export documents, then applies OCR and structured extraction, matched to a single producer / plot / lot identity so records from many sources resolve to one profile.",

    "l3.label": "3. Evidence and reconciliation layer",
    "l3.b1.h": "Registry / customs cross-check",
    "l3.b1.p": "Confirms legal identity, land ownership and declared trade flows against independent public records, drawing on the EU e-Ambrosia register and seeded consortium data rather than direct SIAN/ICQRF API access in Phase 1.",
    "l3.b2.h": "Consortium / DOP-IGP check",
    "l3.b2.p": "Confirms designation eligibility and production-zone compliance.",
    "l3.b3.h": "Satellite / agronomic yield model",
    "l3.b3.p": "Independent estimate of plausible production volume for the plot and season.",
    "l3.engine.h": "Reconciliation engine",
    "l3.engine.p": "Compares declared volume, origin and designation claims against the independent evidence above. Produces a certification level (spectrum position) and a trust score, and flags discrepancies for review.",

    "l4.label": "4. Importer-facing layer",
    "l4.b1.h": "Importer dashboard",
    "l4.b1.p": "Supplier risk scores, certification levels, flagged shipments, audit history.",
    "l4.b2.h": "Exportable certificate",
    "l4.b2.p": "Per-shipment or per-lot compliance certificate for customs, retailers or lenders.",
    "l4.b3.h": "API access",
    "l4.b3.p": "Pulls scores and alerts directly into the importer's own procurement or ERP system.",

    "l3b.label": "3b. Transaction matching layer (per-deal, fee-generating)",
    "l3b.b1.h": "Buyer PO upload and share",
    "l3b.b1.p": "The platform does not create the PO. The importer uploads their existing purchase order (PDF or API) and shares it with the named supplier on the platform.",
    "l3b.b2.h": "Seller document match",
    "l3b.b2.p": "Exporter/trader uploads the corresponding invoice, packing list and export declaration tied to that same PO.",
    "l3b.engine.h": "PO-to-invoice match and fee capture",
    "l3b.engine.p": "Confirms the invoice matches the PO in product, volume and origin, and that both align with the certification level already established for that lot. A small fee (flat or basis-points on invoice value) is captured per matched transaction. Both sides receive a shared, tamper-evident verified-transaction record without exposing full commercial terms to each other.",

    "l3c.label": "3c. Physical lab verification (premium tier)",
    "l3c.b1.h": "Test-on-demand",
    "l3c.b1.p": "Importer or reconciliation engine triggers a lab test (isotope ratio, DNA barcoding, NMR profiling) for a specific lot, billed per test plus margin.",
    "l3c.b2.h": "Risk-weighted random testing",
    "l3c.b2.p": "Certified lots are periodically and unpredictably selected for surprise testing, weighted toward higher-value products and any prior discrepancy flags, funded from the subscription/fee pool or by a consortium.",
    "l3c.engine.h": "Lab-Verified certification badge",
    "l3c.engine.p": "Physical test results become a distinct, premium certification badge layered on top of the spectrum level. Requires ISO 17025 (or equivalent) accredited lab partners and documented chain of custody, so results hold up under dispute, unlike the contested, non-accredited testing seen in the Australian Four Corners tomato case.",

    "l5.label": "Primary paying users",
    "l5.b1.h": "Importers",
    "l5.b1.p": "Subscribe to monitor their supplier base and pay a small fee per verified transaction. Bear the compliance, customs and brand risk this platform is built to reduce.",

    "fraud.title": "Why multiple evidence streams, not one",
    "fraud.i1.h": "A single mark has already been defeated in this industry",
    "fraud.i1.p": "The Prosciutto di Parma fire-brand forgery case shows a single physical mark can be counterfeited. Cross-checking documents against independent satellite/agronomic evidence, and at the premium tier, lab testing, means a counterfeiter has to beat multiple independent streams at once, not just one. This is the product-level rationale for the three-evidence-stream architecture above.",
    "challenges.title": "Three challenges",
    "challenges.i1.h": "1. Supply-chain blending vs. plot verification",
    "challenges.i1.p": "Concern: multi-farm cooperative blending makes single-plot satellite tracking impractical for processed exports like olive oil, wine, and pasta. Core opportunity: replace satellite reliance with automated chemical COA auditing (acidity, peroxides, isotopic profiles) to verify lot integrity and origin scientifically.",
    "challenges.i2.h": "2. Closed Italian government and consortium ecosystems",
    "challenges.i2.p": "Concern: official Italian agricultural registers (SIAN, ICQRF) and consorzi operate without open public developer APIs. Core opportunity: use forensic OCR to directly ingest and authenticate tamper-evident certificates from accredited inspection bodies (CSQA, CCPB, ICEA) instead.",
    "challenges.i3.h": "3. Selective supplier disclosure",
    "challenges.i3.p": "Concern: exporters attempting origin substitution will not voluntarily upload documents detailing foreign ingredient purchases. Core opportunity: cross-document triangulation, matching statutory customs declarations, bill-of-lading weights, and packaging ratios, to flag volume and origin anomalies automatically.",
    "side.title": "Secondary consumers of the same verified data (Phase 2)",
    "side.i1.h": "Banks / insurers",
    "side.i1.p": "Query verified production data to underwrite trade finance or crop insurance.",
    "side.i2.h": "DOP/IGP consortiums",
    "side.i2.p": "License the platform to police counterfeiting of their own designation.",
    "side.i3.h": "Retailers / brands",
    "side.i3.p": "Enterprise tier for bulk supplier verification without doing their own diligence.",
    "side.i4.h": "Regulators / customs",
    "side.i4.p": "Reduced fraud and easier enforcement, an indirect beneficiary rather than a payer.",

    "core.title": "Built and reusable from VeriPura Core today",
    "core.i1.h": "Lab accreditation checking (feeds 3c)",
    "core.i1.p": "OCR/API COA ingestion, checked against ILAC MRA / IAF MLA accreditation bodies.",
    "core.i2.h": "Chain-of-custody matching (feeds 3b)",
    "core.i2.p": "Container, seal and weight-tolerance cross-checks between physical evidence and shipping documents.",
    "core.i3.h": "Plot/polygon geolocation (feeds evidence layer 3)",
    "core.i3.p": "GeoJSON plot-perimeter validation, pending confirmation it fits Italian farm-plot scale below the deforestation-risk threshold it was built for.",
    "core.i4.h": "Registry / accreditation-body pattern (feeds 3.b1 / 3.b2)",
    "core.i4.p": "A working template from the Organic e-COI and Halal MRA registry modules for maintaining and sweeping a list of recognized consortium or control bodies.",
    "core.i5.h": "Tamper-evident passport (feeds 3b engine, layer 4 certificate)",
    "core.i5.p": "A cryptographically anchored record with a public QR code, a working implementation of the tamper-evident receipt both sides need.",

    footer: "Internal working reference, Vero Italiano platform architecture. Not a finalized technical specification."
  },
  it: {
    h1: "Vero Italiano - Architettura della Piattaforma",
    subtitle: "Vero Italiano e un marchio di fiducia, non un marketplace. Non acquisisce mai la proprieta della merce e non si interpone nella relazione tra acquirente e venditore; verifica transazioni specifiche e certifica prodotti specifici, il che valorizza la reputazione degli esportatori e dei trader che ottengono il marchio anziche sostituirli.",
    "l0.label": "Contributori di dati",
    "l0.b1.h": "Esportatori / Produttori",
    "l0.b1.p": "Caricano fatture, registri di lotto, documenti di spedizione e doganali. Onboarding gratuito o a basso costo per massimizzare la partecipazione.",
    "l0.b2.h": "Consorzi / Registri",
    "l0.b2.p": "Registri di appartenenza DOP/IGP, registri delle imprese e catastali, autorita doganali. I registri ufficiali italiani (SIAN, ICQRF) non hanno API pubbliche, quindi la Fase 1 si basa sul registro aperto e-Ambrosia dell'UE e su elenchi di iscritti ai consorzi precaricati, anziche su accordi API di registro in tempo reale.",
    "l0.b3.h": "Fornitori Satellitari / Agronomici",
    "l0.b3.p": "Copernicus Sentinel-2 tramite il Copernicus Data Space Ecosystem, gratuito e ad accesso aperto, risoluzione di 10m aggiornata ogni 5 giorni. NDVI e riflettanza vengono interrogati direttamente per coordinate, senza scaricare immagini raster, con una latenza di 1-2 secondi, memorizzati nella cache come i controlli di geofence esistenti. I benchmark di resa provengono dalle tabelle regionali di ISMEA per provincia e coltura.",

    "l1.label": "1. Livello di acquisizione",
    "l1.b1.h": "Portale produttore",
    "l1.b1.i1": "Caricamento documenti guidato, attrito minimo",
    "l1.b1.i2": "Acquisizione identita di lotto / appezzamento / azienda agricola",
    "l1.b1.i3": "Tracciamento dello stato per il produttore",
    "l1.b2.h": "Connettore ERP / EDI",
    "l1.b2.i1": "API opzionale per produttori piu grandi",
    "l1.b2.i2": "Sincronizzazione massiva di fatture e documenti di spedizione",

    "l2.label": "2. Estrazione e normalizzazione (VeriPura Core)",
    "l2.b1.h": "VeriPura Core: validazione documentale",
    "l2.b1.p": "Verifica la legittimita e la completezza dei documenti di esportazione, quindi applica OCR ed estrazione strutturata, associati a un'unica identita di produttore / appezzamento / lotto, cosi che i record provenienti da piu fonti confluiscano in un solo profilo.",

    "l3.label": "3. Livello di evidenza e riconciliazione",
    "l3.b1.h": "Verifica incrociata con registri / dogana",
    "l3.b1.p": "Conferma l'identita legale, la proprieta del terreno e i flussi commerciali dichiarati rispetto a registri pubblici indipendenti, basandosi sul registro e-Ambrosia dell'UE e su dati di consorzio precaricati anziche sull'accesso diretto alle API di SIAN/ICQRF nella Fase 1.",
    "l3.b2.h": "Verifica consorzio / DOP-IGP",
    "l3.b2.p": "Conferma l'idoneita alla denominazione e la conformita alla zona di produzione.",
    "l3.b3.h": "Modello di resa satellitare / agronomico",
    "l3.b3.p": "Stima indipendente del volume di produzione plausibile per l'appezzamento e la stagione.",
    "l3.engine.h": "Motore di riconciliazione",
    "l3.engine.p": "Confronta il volume dichiarato, l'origine e le dichiarazioni di denominazione con le evidenze indipendenti sopra descritte. Produce un livello di certificazione (posizione sullo spettro) e un punteggio di fiducia, e segnala le discrepanze per la revisione.",

    "l4.label": "4. Livello rivolto all'importatore",
    "l4.b1.h": "Cruscotto importatore",
    "l4.b1.p": "Punteggi di rischio fornitore, livelli di certificazione, spedizioni segnalate, cronologia di audit.",
    "l4.b2.h": "Certificato esportabile",
    "l4.b2.p": "Certificato di conformita per spedizione o per lotto, utilizzabile per dogana, rivenditori o finanziatori.",
    "l4.b3.h": "Accesso API",
    "l4.b3.p": "Trasferisce punteggi e avvisi direttamente nel sistema di approvvigionamento o ERP dell'importatore.",

    "l3b.label": "3b. Livello di riscontro transazionale (per operazione, genera commissioni)",
    "l3b.b1.h": "Caricamento e condivisione del PO da parte del compratore",
    "l3b.b1.p": "La piattaforma non crea l'ordine d'acquisto. L'importatore carica il proprio ordine d'acquisto esistente (PDF o API) e lo condivide con il fornitore indicato sulla piattaforma.",
    "l3b.b2.h": "Riscontro documentale del venditore",
    "l3b.b2.p": "L'esportatore/trader carica la fattura corrispondente, la packing list e la dichiarazione di esportazione collegate allo stesso ordine.",
    "l3b.engine.h": "Riscontro ordine-fattura e riscossione della commissione",
    "l3b.engine.p": "Conferma che la fattura corrisponda all'ordine per prodotto, volume e origine, e che entrambi siano coerenti con il livello di certificazione gia stabilito per quel lotto. Viene applicata una piccola commissione (fissa o in punti base sul valore della fattura) per ogni transazione verificata. Entrambe le parti ricevono un record di transazione verificata condiviso e a prova di manomissione, senza esporre reciprocamente i termini commerciali completi.",

    "l3c.label": "3c. Verifica di laboratorio fisica (livello premium)",
    "l3c.b1.h": "Test su richiesta",
    "l3c.b1.p": "L'importatore o il motore di riconciliazione attiva un test di laboratorio (analisi del rapporto isotopico, codice a barre del DNA, profilazione NMR) per un lotto specifico, fatturato per test piu un margine.",
    "l3c.b2.h": "Test casuali ponderati per rischio",
    "l3c.b2.p": "I lotti certificati vengono selezionati periodicamente e in modo imprevedibile per test a sorpresa, con maggiore frequenza per i prodotti di maggior valore e per chi ha gia segnalazioni di discrepanza, finanziati dal fondo di abbonamenti/commissioni o da un consorzio.",
    "l3c.engine.h": "Marchio di certificazione Lab-Verified",
    "l3c.engine.p": "I risultati dei test fisici diventano un marchio di certificazione premium distinto, sovrapposto al livello dello spettro. Richiede laboratori partner accreditati ISO 17025 (o equivalente) e una catena di custodia documentata, cosi che i risultati reggano in caso di contestazione, a differenza dei test contestati e non accreditati visti nel caso dei pomodori di Four Corners in Australia.",

    "l5.label": "Utenti paganti principali",
    "l5.b1.h": "Importatori",
    "l5.b1.p": "Si abbonano per monitorare la propria base di fornitori e pagano una piccola commissione per ogni transazione verificata. Sostengono il rischio di conformita, doganale e di marchio che questa piattaforma e pensata per ridurre.",

    "fraud.title": "Perche piu flussi di evidenza, non uno solo",
    "fraud.i1.h": "Un marchio unico e gia stato aggirato in questo settore",
    "fraud.i1.p": "Il caso di falsificazione del marchio a fuoco del Prosciutto di Parma dimostra che un singolo marchio fisico puo essere contraffatto. Incrociare i documenti con evidenze satellitari/agronomiche indipendenti, e al livello premium con test di laboratorio, significa che un contraffattore deve battere piu fonti indipendenti insieme, non solo una. Questa e la ragione, a livello di prodotto, dell'architettura a tre flussi di evidenza descritta sopra.",
    "challenges.title": "Tre sfide",
    "challenges.i1.h": "1. Miscelazione della filiera vs. verifica del singolo appezzamento",
    "challenges.i1.p": "Il problema: la miscelazione multi-azienda tipica delle cooperative rende impraticabile il tracciamento satellitare per singolo appezzamento per esportazioni trasformate come olio d'oliva, vino e pasta. Opportunita per Core: sostituire la dipendenza dal satellite con un audit chimico automatizzato del COA (acidita, perossidi, profili isotopici) per verificare scientificamente l'integrita e l'origine del lotto.",
    "challenges.i2.h": "2. Ecosistemi chiusi di enti governativi e consorzi italiani",
    "challenges.i2.p": "Il problema: i registri agricoli ufficiali italiani (SIAN, ICQRF) e i consorzi operano senza API pubbliche per sviluppatori. Opportunita per Core: usare l'OCR forense per acquisire e autenticare direttamente certificati a prova di manomissione emessi da organismi di ispezione accreditati (CSQA, CCPB, ICEA).",
    "challenges.i3.h": "3. Divulgazione selettiva da parte dei fornitori",
    "challenges.i3.p": "Il problema: gli esportatori che tentano una sostituzione dell'origine non caricheranno volontariamente documenti che dettagliano acquisti di ingredienti esteri. Opportunita per Core: triangolazione incrociata dei documenti, confrontando dichiarazioni doganali statutarie, pesi della polizza di carico e rapporti di confezionamento, per segnalare automaticamente anomalie di volume e origine.",
    "side.title": "Consumatori secondari degli stessi dati verificati (Fase 2)",
    "side.i1.h": "Banche / assicuratori",
    "side.i1.p": "Interrogano i dati di produzione verificati per sottoscrivere finanziamenti commerciali o assicurazioni agricole.",
    "side.i2.h": "Consorzi DOP/IGP",
    "side.i2.p": "Concedono in licenza la piattaforma per contrastare la contraffazione della propria denominazione.",
    "side.i3.h": "Rivenditori / marchi",
    "side.i3.p": "Livello enterprise per la verifica massiva dei fornitori senza svolgere una propria due diligence.",
    "side.i4.h": "Regolatori / dogana",
    "side.i4.p": "Riduzione della frode e applicazione piu semplice delle norme, un beneficiario indiretto piuttosto che un pagante.",

    "core.title": "Gia costruito e riutilizzabile da VeriPura Core",
    "core.i1.h": "Verifica dell'accreditamento dei laboratori (alimenta 3c)",
    "core.i1.p": "Acquisizione dei certificati di analisi via OCR/API, verificata rispetto agli organismi di accreditamento ILAC MRA / IAF MLA.",
    "core.i2.h": "Verifica della catena di custodia (alimenta 3b)",
    "core.i2.p": "Verifiche incrociate su container, sigilli e tolleranza di peso tra l'evidenza fisica e i documenti di spedizione.",
    "core.i3.h": "Geolocalizzazione di appezzamenti/poligoni (alimenta il livello 3 di evidenza)",
    "core.i3.p": "Validazione del perimetro dell'appezzamento tramite GeoJSON, in attesa di conferma che si adatti alla scala degli appezzamenti agricoli italiani, al di sotto della soglia di rischio deforestazione per cui e stata costruita.",
    "core.i4.h": "Schema di registro / organismo di accreditamento (alimenta 3.b1 / 3.b2)",
    "core.i4.p": "Un modello funzionante ricavato dai moduli di registro e-COI biologico e Halal MRA per mantenere e verificare periodicamente un elenco di organismi di controllo o consorzi riconosciuti.",
    "core.i5.h": "Passaporto a prova di manomissione (alimenta il motore 3b, il certificato del livello 4)",
    "core.i5.p": "Un record ancorato crittograficamente con un codice QR pubblico, un'implementazione funzionante della ricevuta a prova di manomissione di cui entrambe le parti hanno bisogno.",

    footer: "Riferimento di lavoro interno, architettura della piattaforma Vero Italiano. Non e una specifica tecnica definitiva."
  }
};

function setLang(lang){
  var dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-it').classList.toggle('active', lang === 'it');
  document.documentElement.setAttribute('lang', lang);
}
setLang('en');

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? '&#9728;&#65039;' : '&#127769;';
  try{ localStorage.setItem('vi-theme', theme); }catch(e){}
}
function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
(function(){
  var saved = 'light';
  try{ saved = localStorage.getItem('vi-theme') || 'light'; }catch(e){}
  applyTheme(saved);
})();
</script>
